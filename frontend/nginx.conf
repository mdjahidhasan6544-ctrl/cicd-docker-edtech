# =====================================================
# Nginx config for the Scholastica frontend container
#
# Responsibilities:
#   1. Serve the React SPA (built static assets from /usr/share/nginx/html)
#   2. Reverse-proxy /api/* requests to the backend service in the
#      `mern-network` Compose network.
#
# Notes:
#   - The frontend uses HashRouter in production, so deep links like
#     /admin/dashboard resolve to /index.html#admin/dashboard automatically.
#     The `try_files` fallback is kept as a safety net for anyone who
#     later switches to BrowserRouter.
#   - The backend service name in docker-compose.yml is `backend`.
# =====================================================

server {
    listen 80;
    server_name _;

    # Security & performance headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long cache for fingerprinted Vite assets
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Reverse-proxy API calls to the backend service ----
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Reasonable timeouts for an API
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Don't buffer huge responses in Nginx
        proxy_buffering off;
    }

    # ---- Serve the SPA ----
    # Any unmatched path falls back to /index.html (SPA routing)
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Optional: tighten exposed server version
    server_tokens off;
}
