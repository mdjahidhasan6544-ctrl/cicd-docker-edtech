# =====================================================
# Scholastica — CI/CD Pipeline
#
# Trigger:   push to `main`
# Job 1:     Build frontend + backend Docker images
#            and push them to Docker Hub (with caching).
# Job 2:     Copy docker-compose.yml to the EC2 host,
#            generate .env from GitHub Secrets, pull
#            the new images, and restart the stack.
# =====================================================

name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - main

# Prevent overlapping deploys — if a previous deploy is still
# running, the new run waits for it to finish.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# ----------------------------------------------------------------
# Defaults applied to every step (e.g. shell options)
# ----------------------------------------------------------------
defaults:
  run:
    shell: bash

jobs:
  # =================================================
  # JOB 1 — Build & Push Docker images
  # =================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ---- Guard rails: fail fast if a lockfile is missing ----
      # The Dockerfiles use `npm ci`, which is strict and exits 1 without
      # a package-lock.json. Catching it here gives a much clearer error
      # than the one inside Docker buildx.
      - name: Verify backend lockfile
        working-directory: ./backend
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::backend/package-lock.json is missing. Run 'npm install' locally and commit it."
            exit 1
          fi

      - name: Verify frontend lockfile
        working-directory: ./frontend
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::frontend/package-lock.json is missing. Run 'npm install' locally and commit it."
            exit 1
          fi

      # ---- Backend image ----
      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mern-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mern-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mern-backend:buildcache,mode=max

      # ---- Frontend image ----
      # VITE_API_URL is injected at build time. Default empty → axiosInstance
      # uses relative paths and the frontend nginx proxies /api to backend.
      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mern-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mern-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mern-frontend:buildcache,mode=max

  # =================================================
  # JOB 2 — Deploy to AWS EC2
  # =================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      # ---- Ensure ~/app exists on EC2 BEFORE scp ----
      # If ~/app doesn't exist, scp will create ~/app as a FILE, and the
      # later `cd ~/app` will fail. Create the directory first.
      - name: Ensure ~/app directory exists on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 1m
          script: |
            set -euo pipefail
            mkdir -p ~/app
            echo "~/app is ready"

      # ---- Securely copy docker-compose.yml to EC2 ----
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"
          command_timeout: 2m

      # ---- Deploy on EC2 via native ssh/rsync/scp (full control over logs) ----
      # This step does everything in one shell so every command's stdout/stderr
      # is visible in the GitHub Actions log, with set -x tracing the failing line.
      - name: Deploy application on EC2
        env:
          EC2_HOST:        ${{ secrets.EC2_HOST }}
          EC2_USER:        ${{ secrets.EC2_USER }}
          EC2_SSH_KEY:     ${{ secrets.EC2_SSH_KEY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ADMIN_EMAIL:     ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD:  ${{ secrets.ADMIN_PASSWORD }}
          MONGO_URI:       ${{ secrets.MONGO_URI }}
          JWT_SECRET:      ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          set -x

          # ---- 1) Materialize SSH key with strict perms ----
          mkdir -p ~/.ssh
          printf '%s' "${EC2_SSH_KEY}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          SSH=(ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts "${EC2_USER}@${EC2_HOST}")

          # ---- 2) Sanity checks (clear error if docker / plugin missing) ----
          if ! "${SSH[@]}" 'command -v docker >/dev/null 2>&1'; then
            echo "::error::docker is not installed on the EC2 host"
            exit 1
          fi
          if ! "${SSH[@]}" 'docker compose version >/dev/null 2>&1'; then
            echo "::error::'docker compose' (v2 plugin) is not available on the EC2 host"
            exit 1
          fi

          # ---- 3) Generate .env on EC2 (with strict perms) ----
          "${SSH[@]}" "cd ~/app && cat > .env <<EOF
          DOCKER_USERNAME=${DOCKER_USERNAME}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          MONGO_URI=${MONGO_URI}
          JWT_SECRET=${JWT_SECRET}
          CLIENT_URL=http://${EC2_HOST}
          ADMIN_NAME=Scholastica Admin
          EOF
          chmod 600 .env"
          echo "::notice::.env written on EC2"

          # ---- 4) Docker login on EC2 ----
          "${SSH[@]}" "echo '${DOCKER_PASSWORD}' | docker login -u '${DOCKER_USERNAME}' --password-stdin"
          echo "::notice::docker login ok on EC2"

          # ---- 5) Pull + recreate the stack ----
          # --force-recreate ensures containers are destroyed and recreated
          # even if Docker thinks the image digest is unchanged (e.g. cached
          # :latest on the EC2 host). Without it, a stale container can keep
          # serving the previous image after a push.
          "${SSH[@]}" 'cd ~/app && docker compose pull'
          echo "::notice::docker compose pull ok on EC2"

          "${SSH[@]}" 'cd ~/app && docker compose up -d --remove-orphans --force-recreate'
          echo "::notice::docker compose up -d --force-recreate ok on EC2"

          # ---- 6) Verify the running frontend image is the freshly-pushed one ----
          # This catches the case where the EC2 host kept running an old container.
          FRONTEND_IMAGE=$("${SSH[@]}" 'docker inspect mern-frontend --format "{{.Image}}"')
          echo "::notice::mern-frontend image id on EC2: ${FRONTEND_IMAGE}"

          # ---- 7) Verify the frontend actually serves content ----
          "${SSH[@]}" 'curl -fsS http://localhost/ | head -c 400'
          echo
          echo "::notice::frontend HTTP probe ok on EC2"

          # ---- 8) Clean up + show status ----
          "${SSH[@]}" 'docker image prune -f && docker compose -f ~/app/docker-compose.yml ps'
